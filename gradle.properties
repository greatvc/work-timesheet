org.gradle.jvmargs=-Xmx2048m
# Το play-services-location φέρνει μαζί του βιβλιοθήκες AndroidX. Με false
# το build σταματάει με "This project uses AndroidX dependencies, but the
# 'android.useAndroidX' property is not enabled". Ο κώδικας της εφαρμογής δεν
# χρησιμοποιεί τίποτα από τις παλιές support βιβλιοθήκες, οπότε δεν χρειάζεται
# jetifier - μόνο αυτός ο διακόπτης.
android.useAndroidX=true
