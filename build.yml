name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK packages
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"
          echo "sdk.dir=$SDK" > local.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: work-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Extract changelog section
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VER: ${{ github.ref_name }}
        run: |
          python3 - > RELEASE_NOTES.md <<'PY'
          import os, re, sys
          ver = os.environ['VER'].lstrip('v')
          try:
              text = open('CHANGELOG.md', encoding='utf-8').read()
          except FileNotFoundError:
              print('No CHANGELOG.md found.'); sys.exit(0)
          head = re.search(r'^##\s.*\[v%s\].*$' % re.escape(ver), text, re.M)
          if not head:
              print('No changelog section for v%s.' % ver); sys.exit(0)
          rest = text[head.end():]
          nxt = re.search(r'^##\s', rest, re.M)
          body = (rest[:nxt.start()] if nxt else rest).strip()
          badge = re.search(r'!\[[^\]]*\]\([^)]*\)', head.group(0))
          print((badge.group(0) + '\n\n' if badge else '') + body)
          PY
          cat RELEASE_NOTES.md

      - name: Name the APK after the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp app/build/outputs/apk/release/app-release.apk "work-timesheet-${{ github.ref_name }}.apk"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file RELEASE_NOTES.md \
            "work-timesheet-${{ github.ref_name }}.apk"
