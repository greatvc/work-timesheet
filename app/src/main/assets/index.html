<!doctype html>
<!-- Work TimeSheet · Android build · v3.0.1 · Last update: 05/10/2026 18:39 (ώρα Ελλάδας) -->
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Work TimeSheet</title>
<style>
  :root{
    --bg:#0b0d12; --card:#151922; --line:#242a36; --label:#8e97a6; --dim:#5d6575;
    --value:#f0b429; --ok:#4ade80; --soft:#7fae92; --brk:#58b0c8;
    box-sizing:border-box;
  }
  *,*::before,*::after{box-sizing:inherit}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:#e7eaf0;
    font:400 15px/1.35 -apple-system,BlinkMacSystemFont,Roboto,"Segoe UI",sans-serif;
    -webkit-tap-highlight-color:transparent;
    display:flex;align-items:center;justify-content:center;padding:16px;
    touch-action:manipulation;
  }

  .card{
    position:relative;overflow:hidden;width:338px;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:0 14px 12px;
    transition:border-color .5s ease,box-shadow .5s ease;
    user-select:none;-webkit-user-select:none;
  }

  /* --- banner + κεφαλίδα --- */
  .banner{
    margin:0 -14px;
    padding:14px 0 11px;
    border-bottom:1px solid var(--line);
  }
  .banner img{
    display:block;width:60%;max-width:186px;height:auto;margin:0 auto;
  }

  /* στρογγυλό κουμπί αδειών, πάνω αριστερά */
  .pto{
    position:absolute;top:9px;right:9px;z-index:6;
    width:42px;height:42px;padding:0;flex:none;
    display:flex;align-items:center;justify-content:center;
    border-radius:50%;
    background:#1b2130;border:1px solid #2c3446;
    transition:background .14s ease,border-color .14s ease,transform .1s ease;
  }
  .pto img{display:block;width:26px;height:26px;pointer-events:none}
  .pto:active:not(:disabled){background:#2a3550;border-color:#4a5a7d;transform:scale(.94)}
  .pto:disabled{opacity:.35}
  .head{
    position:relative;
    display:flex;align-items:center;
    min-height:70px;
    padding:8px 0 9px;margin-bottom:2px;
    border-bottom:1px solid var(--line);
  }
  .head .worker{
    position:absolute;left:2px;top:50%;transform:translateY(-50%);
    height:54px;width:auto;z-index:1;opacity:.95;
  }
  .daybox{
    position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
    text-align:center;
  }
  .daybox canvas{
    position:absolute;left:0;top:-4px;width:100%;height:104px;
    pointer-events:none;z-index:3;
  }
  .day{
    position:relative;left:20px;z-index:2;display:inline-block;
    font-size:25px;font-weight:900;letter-spacing:.4px;line-height:1.2;
    color:#e7eaf0;transition:color .4s ease,text-shadow .4s ease;
  }

  /* διάθεση της ημέρας */
  .day.d-mon{color:#ff2b2b;text-shadow:0 0 14px rgba(255,43,43,.6),0 0 28px rgba(255,43,43,.25)}
  .day.d-tue{color:#ff8a80;text-shadow:0 0 10px rgba(255,138,128,.38)}
  .day.d-wed{color:#f0b429;text-shadow:0 0 10px rgba(240,180,41,.35)}
  .day.d-thu{color:#9fe0b4;text-shadow:0 0 10px rgba(159,224,180,.3)}
  .day.d-fri{color:#22e06a;text-shadow:0 0 16px rgba(34,224,106,.75),0 0 34px rgba(34,224,106,.35)}
  .day.d-sat,.day.d-sun{color:#5ad7a0;text-shadow:0 0 12px rgba(90,215,160,.4)}
  /* αργία ή άδεια: η μέρα χαίρεται, ό,τι μέρα κι αν είναι */
  .day.d-off{
    color:#3ce97a;
    text-shadow:0 0 10px rgba(60,233,122,.9),
                0 0 22px rgba(60,233,122,.55),
                0 0 40px rgba(60,233,122,.3);
  }
  /* αργία: πανηγύρι πάνω από όλη την οθόνη */
  .holiday{
    position:fixed;inset:0;z-index:50;
    display:flex;align-items:center;justify-content:center;
    background:rgba(7,9,13,.34);
    -webkit-backdrop-filter:blur(1.4px);backdrop-filter:blur(1.4px);
    animation:fade .5s ease-out;
  }
  .holiday[hidden]{display:none}
  .holiday canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .holiday img[hidden]{display:none}
  .holiday img{
    position:relative;z-index:2;
    width:82%;max-width:340px;height:auto;
    filter:drop-shadow(0 14px 26px rgba(0,0,0,.5))
           drop-shadow(0 0 20px rgba(245,196,81,.35));
    animation:holiIn 1.05s cubic-bezier(.18,.85,.28,1.12) both,
              holiShake .5s ease-in-out 1.15s 3;
  }
  @keyframes holiIn{
    0%{opacity:0;transform:scale(.62) translateY(26px)}
    55%{opacity:1;transform:scale(1.04) translateY(0)}
    100%{opacity:.78;transform:scale(1)}   /* κατακάθεται χλωμή, να περνάει η κάρτα από πίσω */
  }
  @keyframes holiShake{
    0%,100%{transform:rotate(0) scale(1)}
    25%{transform:rotate(-2.4deg) scale(1.015)}
    75%{transform:rotate(2.4deg) scale(1.015)}
  }
  .day.shake{animation:dayshake .42s ease-in-out 0s 5}
  @keyframes dayshake{
    0%,100%{transform:translateX(0) rotate(0)}
    20%{transform:translateX(-3px) rotate(-1.6deg)}
    45%{transform:translateX(3px) rotate(1.6deg)}
    70%{transform:translateX(-2px) rotate(-1deg)}
  }

  .row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:5px 0}
  .row .k{color:var(--label);font-weight:600}
  .row .v{color:var(--value);font-weight:700;font-variant-numeric:tabular-nums;font-size:19px}
  .rest .v{font-size:26px;line-height:1.1;transition:color .6s ease,text-shadow .6s ease}
  .rcolon{transition:opacity .12s linear}
  .rcolon.off{opacity:.15}
  .rest .v.hot{color:#ff3b30;text-shadow:0 0 12px rgba(255,59,48,.6),0 0 24px rgba(255,59,48,.25)}
  .rest .v.warm{color:#ef8a84;text-shadow:0 0 8px rgba(239,138,132,.28)}
  .rest .v.soon{color:var(--value);text-shadow:none}
  .endr .v{color:var(--soft);font-weight:600}
  .colon{transition:opacity .12s linear}
  .colon.off{opacity:.18}

  .brkbox{
    margin:8px -4px 2px;padding:6px 8px 4px;border-radius:9px;
    background:rgba(88,176,200,.08);border:1px solid rgba(88,176,200,.22);
  }
  .brkbox[hidden]{display:none}
  .brkbox .k{color:#8fbecb}
  .brkbox .v{color:var(--brk)}
  .brkbox .count .v{font-size:22px}

  .sep{height:1px;background:var(--line);margin:10px -2px 8px}
  .state{color:var(--label);font-size:13.5px;min-height:19px;font-weight:600}
  .sub{color:var(--dim);font-size:12.5px;margin-top:3px;min-height:16px}
  .legend{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:12.5px;margin-top:4px}
  .legend[hidden]{display:none}
  .legend .dot{width:6px;height:6px;border-radius:50%;background:var(--brk);flex:none}

  .btns{display:flex;gap:8px;margin-top:12px}
  button{
    flex:1;font:inherit;font-weight:600;font-size:14px;color:#dfe4ec;
    background:#1d2330;border:1px solid var(--line);border-radius:9px;padding:9px 10px;
    -webkit-appearance:none;transition:background .15s ease,opacity .15s ease;
  }
  button .ic{font-size:40px;line-height:1}
  #btnReset{padding:3px;line-height:1}
  button.go{
    display:flex;align-items:center;justify-content:center;
    padding:4px;
    background:#8fd9a8;
    border-color:#8fd9a8;
    transition:background .12s ease,border-color .12s ease,filter .2s ease,opacity .2s ease;
  }
  button.go img{display:block;height:46px;width:auto;pointer-events:none}
  button.go img[hidden]{display:none}
  button.go:active:not(:disabled){
    color:#eafff2;
    background:#1c6b3d;
    border-color:#1c6b3d;
  }
  button.go:disabled{
    background:#33607f;
    border-color:#33607f;
    filter:grayscale(.35);
    opacity:.78;
  }

  #btnReset{position:relative;overflow:hidden}
  #btnReset.armed{background:#7a2030;border-color:#c04358}
  #btnReset .fill{
    position:absolute;left:0;bottom:0;height:3px;width:100%;
    background:#ff7183;transform:scaleX(0);transform-origin:left;
  }

  button.brkbtn{
    width:100%;margin-top:8px;display:flex;align-items:center;justify-content:center;
    padding:4px;color:#e6f6fb;background:#1b5064;border-color:#276b83;
  }
  button.brkbtn img{display:block;height:38px;width:auto;pointer-events:none}
  button.brkbtn[hidden]{display:none}
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.32}

  .ver{
    margin-top:11px;
    display:flex;align-items:center;justify-content:center;gap:18px;
    font-size:11.5px;letter-spacing:.3px;color:#858d9c;
  }
  .ver .tagico{font-size:12px;line-height:1}
  .ver.armed{color:#f5c451;transition:color .2s ease}
  .ver.failed{color:#ff5a5a;transition:color .2s ease}

  .done{border-color:rgba(74,222,128,.45)}
  .done .row .v,.done .state{color:var(--ok)}
  .done .state{font-size:18px;font-weight:800;letter-spacing:.4px;animation:textglow 2.4s ease-in-out infinite}
  .done .state .party{font-size:21px;margin-left:10px;vertical-align:-1px;text-shadow:none}
  .done.flash{animation:glow 1.6s ease-out 2}
  @keyframes textglow{
    0%,100%{text-shadow:0 0 8px rgba(74,222,128,.35)}
    50%{text-shadow:0 0 16px rgba(74,222,128,.7),0 0 30px rgba(74,222,128,.28)}
  }
  @keyframes glow{
    0%{box-shadow:0 0 0 0 rgba(74,222,128,0)}
    35%{box-shadow:0 0 22px 2px rgba(74,222,128,.28)}
    100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}
  }

  /* ---------- οθόνη αδειών ---------- */
  .sheet{
    position:fixed;inset:0;z-index:60;
    display:flex;align-items:center;justify-content:center;padding:14px;
    background:rgba(6,8,12,.74);
    -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
    animation:fade .18s ease-out;
  }
  .sheet[hidden]{display:none}
  .sheetbox{
    width:100%;max-width:342px;max-height:92vh;overflow:auto;
    background:#151922;border:1px solid #242a36;border-radius:16px;padding:14px;
    animation:rise .2s ease-out;
  }
  .sheethead{display:flex;align-items:center;gap:9px;margin-bottom:12px}
  .sheethead img{width:27px;height:27px;display:block}
  .sheethead span{flex:1;font-size:16px;font-weight:800;letter-spacing:.2px}
  .xbtn{
    width:32px;height:32px;border-radius:50%;padding:0;flex:none;font-size:15px;
    background:#1d2330;border:1px solid #2a3140;color:#9aa3b2;
  }
  .warnline{
    font-size:11.5px;color:#f0b429;background:rgba(240,180,41,.1);
    border-radius:9px;padding:7px 9px;margin-bottom:10px;
  }
  .warnline[hidden]{display:none}

  .lrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #1e2430}
  .lico{
    width:35px;height:35px;border-radius:50%;flex:none;
    display:flex;align-items:center;justify-content:center;font-size:19px;
  }
  .lico img{height:24px;width:auto;max-width:24px;display:block;object-fit:contain}
  .lmain{flex:1;min-width:0;display:flex;align-items:center}
  .ldate{
    flex:1;min-width:0;
    font-size:13px;font-weight:700;color:#e7eaf0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .lsep{font-size:7px;margin:0 8px;line-height:1;opacity:.9;flex:none}
  .lsub{font-size:12px;font-weight:700;white-space:nowrap;flex:none}
  .ldel{
    width:32px;height:32px;border-radius:9px;padding:0;flex:none;font-size:14px;
    background:transparent;border:1px solid transparent;color:#5d6575;
  }
  .ldel.arm{color:#ff7183;border-color:#7a2030;background:#2a1118}
  .empty{padding:18px 2px;text-align:center;color:#5d6575;font-size:12.5px}

  #leaveList{
    max-height:46vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
    scrollbar-width:thin;scrollbar-color:#39415240 transparent;
  }
  #leaveList::-webkit-scrollbar{width:4px}
  #leaveList::-webkit-scrollbar-track{background:transparent}
  #leaveList::-webkit-scrollbar-thumb{background:#394152;border-radius:4px}

  .tip{
    position:fixed;z-index:80;pointer-events:none;
    max-width:86vw;padding:9px 13px;border-radius:11px;
    background:#0e131c;border:1px solid #2c3446;
    box-shadow:0 10px 28px rgba(0,0,0,.6);
    font-size:13.5px;font-weight:700;color:#e7eaf0;white-space:nowrap;
    animation:fade .12s ease-out;
  }
  .tip[hidden]{display:none}

  .totals{display:flex;gap:9px;margin:13px 0 11px}
  .tot{flex:1;border-radius:12px;padding:11px 8px;text-align:center;background:#1a202c}
  .tot .k{display:block;font-size:13.5px;font-weight:600;color:#9aa5b5;letter-spacing:.2px}
  .tot .v{display:block;font-size:32px;font-weight:800;margin-top:3px;color:#7fb2ff}
  .tot.rest{background:rgba(74,222,128,.1)}

  @keyframes overshake{
    0%,100%{transform:translateX(0)}
    15%{transform:translateX(-5px)}
    30%{transform:translateX(5px)}
    45%{transform:translateX(-4px)}
    60%{transform:translateX(4px)}
    80%{transform:translateX(-2px)}
  }
  .tot.rest .k{color:#8ad3aa}
  .tot.rest .v{color:#4ade80}
  .tot.rest.over{background:rgba(224,31,40,.15)}
  .tot.rest.over .k{color:#ff9aa4}
  .tot.rest.over .v{
    color:#ff3b30;
    text-shadow:0 0 14px rgba(255,59,48,.7),0 0 30px rgba(255,59,48,.35);
  }
  .tot.rest.over.shake{animation:overshake 1s ease-in-out 1}

  .sheetbtns{display:flex;gap:8px}
  .sheetbtns button{font-size:14px;padding:11px 10px}
  .sheetbtns .main{
    flex:1;font-weight:700;font-size:15px;color:#cfe0ff;background:#1d2a44;border-color:#2f4266;
    display:flex;align-items:center;justify-content:center;gap:9px;
  }
  .sheetbtns .main img{height:26px;width:auto;display:block}
  .entbtn{
    width:46px;height:46px;border-radius:50%;padding:0;flex:none;
    display:flex;align-items:center;justify-content:center;
    background:#1b2130;border:1px solid #2c3446;
  }
  .entbtn img{width:27px;height:27px;display:block}
  .entbtn:active{background:#2a3550;border-color:#4a5a7d}

  /* φόρμα */
  .frow{display:flex;gap:9px}
  .frow label{flex:1;font-size:11.5px;color:#8e97a6}
  .dwrap{position:relative;margin-top:4px}
  .dlabel{
    position:absolute;left:11px;top:50%;transform:translateY(-50%);
    pointer-events:none;font-size:14.5px;font-weight:600;color:#e7eaf0;
    font-variant-numeric:tabular-nums;
  }
  .fdate{
    display:block;width:100%;
    font:inherit;font-size:14px;color:transparent;
    background:#1b2130;border:1px solid #2c3446;border-radius:9px;padding:9px 8px;
    color-scheme:dark;
  }
  .fdate.bad{border-color:#c04358;background:#2a1118}
  .hint{font-size:11.5px;color:#5d6575;margin:7px 0 13px}
  .chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:13px}
  .chip{gap:9px;min-width:0;overflow:hidden}
  .chip span.ctx{
    min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .chip{
    display:flex;align-items:center;gap:7px;padding:9px 9px;
    border-radius:10px;border:1px solid #2a3140;background:#1a202c;
    font-size:12.5px;color:#aab2c0;
  }
  .chip img{height:21px;width:auto;max-width:21px;display:block;object-fit:contain}
  .chip img.egg{width:14px;object-fit:fill}
  .lico img.egg{width:16px;object-fit:fill}
  .cem{font-size:21px;line-height:1;display:inline-block}
  .chip.on{font-weight:700}
  .dcount{
    border-radius:11px;padding:14px 10px;text-align:center;margin-bottom:12px;
    background:rgba(198,150,40,.14);
  }
  .dcount b{display:block;font-size:30px;font-weight:800;color:#e0a92e}
  .dcount span{font-size:14px !important;color:#c9a663 !important;font-weight:600}
  .ferr{font-size:12px;color:#ff7183;margin-bottom:10px}
  .ferr[hidden]{display:none}

  /* μετρητής δικαιούμενων */
  .steptitle{font-size:16px;font-weight:800;text-align:center}
  .steptitle{margin-bottom:16px}
  .steprow{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:18px}
  .steprow button{
    width:48px;height:48px;border-radius:50%;padding:0;flex:none;font-size:20px;
    background:#1b2130;border:1px solid #2c3446;color:#cfe0ff;
  }
  .steprow button:active{background:#2a3550}
  .entnum{font-size:40px;font-weight:800;color:#7fb2ff;line-height:1.05;text-align:center;min-width:72px}
  .entrange{font-size:11px;color:#5d6575;text-align:center}

  /* ---------- ρυθμίσεις ---------- */
  .gear{
    position:fixed;z-index:30;
    top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;
    width:42px;height:42px;padding:0;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:#1b2130;border:1px solid #2c3446;
  }
  .gear img{width:26px;height:26px;display:block;pointer-events:none}
  .gear:active{background:#2a3550;border-color:#4a5a7d}

  .sec{font-size:11px;font-weight:700;letter-spacing:.5px;color:#8e97a6;margin:16px 2px 8px}
  .sec:first-of-type{margin-top:6px}
  .opt{
    display:flex;align-items:center;gap:10px;
    background:#1a202c;border-radius:11px;padding:11px 12px;margin-bottom:8px;
  }
  .opt .lbl{flex:1;min-width:0;font-size:13.5px;color:#cfd6e2}
  .opt.off .lbl{color:#5d6575}
  .step{
    width:32px;height:32px;border-radius:50%;padding:0;flex:none;font-size:17px;
    background:#1b2130;border:1px solid #2c3446;color:#cfe0ff;
  }
  .step:disabled{opacity:.3}
  .num{min-width:58px;text-align:center;font-size:20px;font-weight:800;color:#7fb2ff;
       font-variant-numeric:tabular-nums}
  .num.brk{color:#58b0c8}
  .opt.off .num{color:#4a5262}

  .sw{
    width:48px;height:27px;border-radius:14px;flex:none;padding:0;position:relative;
    background:#262c38;border:1px solid #333b4a;transition:background .16s ease;
  }
  .sw i{
    position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;
    background:#6b7484;transition:left .16s ease,background .16s ease;
  }
  .sw.on{background:#2f6d4a;border-color:#3c8a5e}
  .sw.on i{left:23px;background:#4ade80}

  .logobox{background:#1a202c;border-radius:11px;padding:13px 12px 12px;margin-bottom:10px}
  .logobox .prev{
    display:flex;align-items:center;justify-content:center;
    min-height:54px;margin-bottom:12px;
  }
  .logobox .prev img{max-width:82%;max-height:56px;height:auto;display:block}
  .logorow{display:flex;gap:8px}
  .logorow .pick{
    flex:1;font-size:13px;font-weight:600;color:#cfe0ff;
    background:#1d2a44;border-color:#2f4266;padding:10px;
  }
  .logorow .undo{
    width:46px;padding:0;flex:none;display:flex;align-items:center;justify-content:center;
  }
  .logorow .undo img{width:22px;height:22px;display:block}
  .savebtn{
    width:100%;margin-top:6px;display:flex;align-items:center;justify-content:center;gap:9px;
    font-size:15px;font-weight:700;color:#cfe0ff;background:#1d2a44;border-color:#2f4266;padding:11px;
  }
  .savebtn img{width:22px;height:22px;display:block}

  .locked{
    display:flex;align-items:center;gap:8px;margin-top:4px;
    background:rgba(240,180,41,.1);border-radius:10px;padding:10px 11px;
    font-size:11.5px;color:#d3ac5c;
  }
  .locked[hidden]{display:none}

  canvas#confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}

  .pop{
    position:absolute;inset:0;z-index:12;
    display:flex;align-items:center;justify-content:center;
    padding:16px;background:rgba(9,11,16,.9);
    backdrop-filter:blur(4px);animation:fade .18s ease-out;
  }
  .pop[hidden]{display:none}
  .pop-in{width:100%;text-align:center;animation:rise .2s ease-out}
  .pop-in p{
    margin:0 0 14px;font-size:19px;font-weight:800;line-height:1.35;color:#e7eaf0;
    white-space:pre-line;
  }

<script>
(function () {
  /* προεπιλογές - όλα ρυθμίζονται από την οθόνη ρυθμίσεων */
  var SHIFT  = 8 * 3600 + 30 * 60;   // διάρκεια βάρδιας
  var BREAK  = 25 * 60;              // διάλειμμα
  var CUTOFF = BREAK + 120;          // νεκρή ζώνη = διάλειμμα + 2'
  var BRKON  = true;                 // έχει διάλειμμα;
  var SET    = { shift: SHIFT, brk: BREAK, brkOn: true, hMP: true, hAP: true, h2J: false };
  var KEY    = 'work-shift';
  var DAYS   = ['Κυριακή','Δευτέρα','Τρίτη','Τετάρτη','Πέμπτη','Παρασκευή','Σάββατο'];

  var card     = document.getElementById('card');
  var elDay    = document.getElementById('day');
  var dayBox   = document.getElementById('daybox');
  var holiBox  = document.getElementById('holiday');
  var holiImg  = document.getElementById('holiimg');
  var argiaImg = document.getElementById('argiaimg');
  var xmasImg  = document.getElementById('xmasimg');
  var easterImg= document.getElementById('easterimg');
  var summerImg= document.getElementById('summerimg');
  var leaveImg = document.getElementById('leaveimg');
  var holiCv   = document.getElementById('balloons');
  var fxCanvas = document.getElementById('fx');
  var elRest   = document.getElementById('rest');
  var rColon   = document.getElementById('rcolon');
  var elEnd    = document.getElementById('endtime');
  var brkBox   = document.getElementById('brkbox');
  var brkLeft  = document.getElementById('brkleft');
  var brkEndEl = document.getElementById('brkend');
  var elState  = document.getElementById('state');
  var elSub    = document.getElementById('sub');
  var legend   = document.getElementById('legend');
  var legendTx = document.getElementById('legendtx');
  var btnGo    = document.getElementById('btnStart');
  var btnRs    = document.getElementById('btnReset');
  var btnBk    = document.getElementById('btnBreak');
  var imgIdle  = document.getElementById('imgIdle');
  var imgRun   = document.getElementById('imgRun');
  var ask      = document.getElementById('ask');
  var pop      = document.getElementById('pop');
  var btnPto   = document.getElementById('btnPto');
  var popTx    = document.getElementById('poptx');

  var A = window.Android || null;   // γέφυρα προς το Android
  var celebrated = false;
  var st;

  var POPTX = {
    brk: '👉 Το Διάλειμμα Τελείωσε   💼',
    end: '🥳  Σχόλασες! 🎉'
  };

  /* 0 = δεν συνέβη, 1 = εκκρεμεί, 2 = το είδα */
  function pendingPop() {
    if (st.popEnd === 1) return 'end';
    if (st.popBrk === 1) return 'brk';
    return null;
  }

  var infoOpen = false;

  /* προσωρινό μήνυμα που δεν κουβαλάει κατάσταση */
  function showInfo(text) {
    popTx.textContent = text;
    popTx.className = 'brk';
    infoOpen = true;
    pop.hidden = false;
  }

  function showPop(kind) {
    popTx.textContent = POPTX[kind];
    popTx.className = kind === 'end' ? 'win' : 'brk';
    pop.hidden = false;
  }

  function two(n){ return (n < 10 ? '0' : '') + n; }
  function setRest(h, m) {
    elRest.childNodes[0].nodeValue = h;
    elRest.childNodes[2].nodeValue = m;
  }
  function now(){ return Date.now() / 1000; }
  function ymd(d){ return d.getFullYear() + '-' + two(d.getMonth() + 1) + '-' + two(d.getDate()); }
  function hhmm(ts){ var d = new Date(ts * 1000); return two(d.getHours()) + ':' + two(d.getMinutes()); }

  /* Το localStorage του WebView γράφεται στον δίσκο με καθυστέρηση: αν η εφαρμογή
     κλείσει αμέσως μετά, η εγγραφή χάνεται. Οπότε η αλήθεια κρατιέται στις
     SharedPreferences μέσω της γέφυρας, που γράφουν συγχρονισμένα. */
  function rawState() {
    if (A && A.getFlag) {
      try { var v = A.getFlag('state'); if (v) return v; } catch (e) {}
    }
    try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; }
  }

  function load() {
    var raw = {};
    try { raw = JSON.parse(rawState() || '{}') || {}; } catch (e) { raw = {}; }
    if (raw.date !== ymd(new Date())) return { date: null, start: null, brk: null, popBrk: 0, popEnd: 0 };
    return {
      date: raw.date, start: raw.start || null, brk: raw.brk || null,
      popBrk: raw.popBrk || 0, popEnd: raw.popEnd || 0
    };
  }

  function save() {
    var json = JSON.stringify(st);
    if (A && A.setFlag) { try { A.setFlag('state', json); } catch (e) {} }
    try { localStorage.setItem(KEY, json); } catch (e) {}
  }

  /* ---- notifications μέσω AlarmManager ---- */
  function schedule(id, epochSec, title, body) {
    if (A && A.schedule) A.schedule(id, String(Math.round(epochSec * 1000)), title, body);
  }
  function cancel(id) { if (A && A.cancel) A.cancel(id); }

  function doStart() {
    var t = Math.floor(now());
    st = { date: ymd(new Date()), start: t, brk: null, popBrk: 0, popEnd: 0 };
    flagSet('notified_1', ''); flagSet('notified_2', '');
    save();
    schedule(1, t + SHIFT, '🥳  Σχόλασες! 🎉', '');
    celebrated = false;
    render();
  }

  function doBreak() {
    var t = Math.floor(now());
    st.brk = t;
    st.popBrk = 0;
    flagSet('notified_2', '');
    save();
    schedule(2, t + BREAK, '👉 Το Διάλειμμα Τελείωσε   💼', '');
    render();
  }

  function doReset() {
    st = { date: null, start: null, brk: null, popBrk: 0, popEnd: 0 };
    flagSet('notified_1', ''); flagSet('notified_2', '');
    save();
    cancel(1); cancel(2);
    pop.hidden = true;
    celebrated = false;
    card.classList.remove('flash');
    render();
  }

  /* ------------------------------ render ------------------------------ */
  /* ---------------- άδειες ---------------- */
  var LTYPES = [
    { id:'plain',  name:'Απλή', short:'Απλή',             icon:'<img src="pto.png" alt="">', col:'#8fb6ff', bg:'rgba(143,182,255,.13)', kind:'leave'  },
    { id:'summer', name:'Καλοκαιρινή', short:'Καλοκαίρι',      icon:'<span class="cem">🏖️</span>', col:'#f0b429', bg:'rgba(240,180,41,.13)', kind:'summer' },
    { id:'xmas',   name:'Χριστουγεννιάτικη', short:'Χριστούγεννα', icon:'<span class="cem">🎄</span>', col:'#4ade80', bg:'rgba(74,222,128,.13)', kind:'xmas'   },
    { id:'easter', name:'Πασχαλινή', short:'Πάσχα',        icon:'<img class="egg" src="egg.png" alt="">', col:'#ef6b6b', bg:'rgba(239,107,107,.13)', kind:'easter' }
  ];
  /* αργίες που εξαρτώνται από διακόπτη */
  var OPTHOL = {
    '2027-04-30': { flag: 'hMP', kind: 'easter'  },   // Μεγάλη Παρασκευή
    '2027-06-21': { flag: 'hAP', kind: 'holiday' },   // Αγίου Πνεύματος
    '2027-01-02': { flag: 'h2J', kind: 'xmas'    }    // 2 Ιανουαρίου, απογραφή
  };
  function hol(key) {
    var o = OPTHOL[key];
    if (o) return SET[o.flag] ? o.kind : null;
    return HOLIDAYS[key] || null;
  }

  function ltype(id) {
    for (var i = 0; i < LTYPES.length; i++) if (LTYPES[i].id === id) return LTYPES[i];
    return LTYPES[0];
  }

  var leaves = [], entitle = {};

  function loadSettings() {
    try {
      var raw = JSON.parse(flagGet('settings') || '{}') || {};
      if (raw.shift) SET.shift = raw.shift;
      if (raw.brk)   SET.brk   = raw.brk;
      if (typeof raw.brkOn === 'boolean') SET.brkOn = raw.brkOn;
      if (typeof raw.hMP  === 'boolean')  SET.hMP  = raw.hMP;
      if (typeof raw.hAP  === 'boolean')  SET.hAP  = raw.hAP;
      if (typeof raw.h2J  === 'boolean')  SET.h2J  = raw.h2J;
    } catch (e) {}
    applySettings();
  }
  function saveSettings() {
    flagSet('settings', JSON.stringify(SET));
    applySettings();
  }
  function applySettings() {
    SHIFT  = SET.shift;
    BRKON  = SET.brkOn;
    BREAK  = SET.brk;
    CUTOFF = BREAK + 120;
    btnBk.hidden = !BRKON;
    shownDay = null;                 // οι αργίες μπορεί να άλλαξαν
  }

  function loadLeaveData() {
    try { leaves = JSON.parse(flagGet('leaves') || '[]') || []; } catch (e) { leaves = []; }
    try { entitle = JSON.parse(flagGet('entitle') || '{}') || {}; } catch (e) { entitle = {}; }
  }
  function saveLeaveData() {
    flagSet('leaves', JSON.stringify(leaves));
    flagSet('entitle', JSON.stringify(entitle));
  }

  function dparse(iso) { var a = iso.split('-'); return new Date(+a[0], +a[1] - 1, +a[2]); }
  function isWeekend(d) { return d.getDay() === 0 || d.getDay() === 6; }

  /* εργάσιμες: χωρίς Σαββατοκύριακα, χωρίς αργίες */
  function workDays(fromIso, toIso) {
    var d = dparse(fromIso), end = dparse(toIso), n = 0, guard = 0;
    while (d <= end && guard++ < 800) {
      if (!isWeekend(d) && !hol(ymd(d))) n++;
      d.setDate(d.getDate() + 1);
    }
    return n;
  }

  /* η άδεια χρεώνεται στη χρονιά που ξεκινάει - εκτός αν ξεκινάει Ιανουάριο
     και έχει μείνει υπόλοιπο από πέρσι */
  function chargeYear(lv) {
    var f = dparse(lv.from), y = f.getFullYear();
    if (f.getMonth() === 0 && carryFrom(y - 1) > 0) return y - 1;
    return y;
  }
  function takenIn(y) {
    var n = 0;
    for (var i = 0; i < leaves.length; i++) {
      var lv = leaves[i];
      if (dparse(lv.from).getFullYear() === y) n += workDays(lv.from, lv.to);
    }
    return n;
  }
  function carryFrom(y) {
    var left = (entitle[y] || 0) - takenIn(y);
    return left > 0 ? left : 0;
  }
  function totalsFor(y) {
    /* διαθέσιμες = όσες κουβαλήθηκαν από πέρσι + όσες δήλωσες φέτος
       σύνολο = όσες μέρες άδειας έχεις πάρει, υπόλοιπο = η διαφορά */
    var avail = carryFrom(y - 1) + (entitle[y] || 0), used = 0;
    for (var i = 0; i < leaves.length; i++) {
      if (chargeYear(leaves[i]) === y) used += workDays(leaves[i].from, leaves[i].to);
    }
    return { used: used, rest: avail - used };
  }

  function overlaps(fromIso, toIso) {
    var a1 = dparse(fromIso), a2 = dparse(toIso);
    for (var i = 0; i < leaves.length; i++) {
      var b1 = dparse(leaves[i].from), b2 = dparse(leaves[i].to);
      if (a1 <= b2 && b1 <= a2) return true;
    }
    return false;
  }

  function leaveOn(iso) {
    var d = dparse(iso);
    for (var i = 0; i < leaves.length; i++) {
      if (d >= dparse(leaves[i].from) && d <= dparse(leaves[i].to)) return leaves[i];
    }
    return null;
  }

  var GRDAY = ['Κυρ','Δευ','Τρι','Τετ','Πεμ','Παρ','Σαβ'];
  var GRDAYFULL = ['Κυριακή','Δευτέρα','Τρίτη','Τετάρτη','Πέμπτη','Παρασκευή','Σάββατο'];

  /* ολόκληρη η περίοδος, για το παρατεταμένο πάτημα */
  function humanFull(fromIso, toIso) {
    var a = dparse(fromIso), b = dparse(toIso);
    function one(d, withYear) {
      return GRDAYFULL[d.getDay()] + ' ' + d.getDate() + '/' + (d.getMonth() + 1)
           + (withYear ? '/' + d.getFullYear() : '');
    }
    var diff = a.getFullYear() !== b.getFullYear();
    if (fromIso === toIso) return one(a, true);
    return one(a, diff) + ' – ' + one(b, true);
  }

  function human(fromIso, toIso) {
    var a = dparse(fromIso), b = dparse(toIso), now = new Date().getFullYear();
    var yr = (a.getFullYear() === now && b.getFullYear() === now) ? '' : ' ' + b.getFullYear();
    function one(d) {
      return GRDAY[d.getDay()] + ' ' + d.getDate() + '/' + (d.getMonth() + 1);
    }
    if (fromIso === toIso) return one(a) + yr;
    return one(a) + ' – ' + one(b) + yr;
  }

  /* ---------------- η ημέρα και η διάθεσή της ---------------- */
  var DAYCLS = ['d-sun','d-mon','d-tue','d-wed','d-thu','d-fri','d-sat'];

  /* μέρες με δικό τους όνομα - αλλάζει μόνο το κείμενο της κεφαλίδας */
  var NAMEDDAY = {
    '2026-01-01': 'Πρωτοχρονιά',
    '2026-01-06': 'Φώτα',
    '2026-02-12': 'Τσικνοπέμπτη',
    '2026-02-23': 'Καθαρά Δευτέρα',
    '2026-04-06': 'Μ. Δευτέρα',
    '2026-04-07': 'Μ. Τρίτη',
    '2026-04-08': 'Μ. Τετάρτη',
    '2026-04-09': 'Μ. Πέμπτη',
    '2026-04-10': 'Μ. Παρασκευή',

    /* μέρα ρεπό: τίποτα δεν πατιέται, ακόμα κι αν παραμερίστηκε το γραφικό */
    var offDay = !!leaveOn(ymd(d)) || !!hol(ymd(d)) || d.getDay() === 0 || d.getDay() === 6;

    /* μηνύματα μέσα στην εφαρμογή, όταν είναι ανοιχτή τη στιγμή που λήγει κάτι */
    if (!document.hidden) {
      if (hadBrk && !st.popBrk && (n - brkEnd) < 150 && flagGet('notified_2') !== '1') {
        st.popBrk = 1; save();
      }
      if (!!st.start && n >= end && !st.popEnd && (n - end) < 150 && flagGet('notified_1') !== '1') {
        st.popEnd = 1; save();
      }
    }

    var want = pendingPop();
    if (!infoOpen) {
      if (want && pop.hidden) showPop(want);
      else if (!want && !pop.hidden) pop.hidden = true;
    }

    imgIdle.hidden = !!st.start;
    imgRun.hidden  = !st.start;

    btnBk.disabled = !BRKON || offDay || !running || !!st.brk
      || (n - st.start) < CUTOFF
      || (end - n) < CUTOFF;

    if (!st.start) {
      card.classList.remove('done', 'flash');
      setRest(two(Math.floor(SHIFT / 3600)), two(Math.round(SHIFT % 3600 / 60)));
      tone(SHIFT);
      elEnd.textContent  = '--:--';
      elState.innerHTML = '&nbsp;';
      elSub.innerHTML   = '&nbsp;';
      btnGo.disabled = offDay;
      btnRs.disabled = true;
      if (rsUntil) disarm();
      return;
    }

    elEnd.textContent = hhmm(end);

    if (running) {
      card.classList.remove('done', 'flash');
      var mins = Math.ceil((end - n) / 60);
      setRest(two(Math.floor(mins / 60)), two(mins % 60));
      tone(end - n);
      elState.textContent = 'Ξεκίνησες ' + hhmm(st.start);
      elSub.innerHTML     = '&nbsp;';
      btnGo.disabled = true;
      btnRs.disabled = offDay;
    } else {
      card.classList.add('done');
      setRest('00', '00');
      if (elState.firstElementChild === null) {
        elState.innerHTML = 'Σχόλασες<span class="party">🎉</span>';
      }
      elSub.textContent = hhmm(st.start) + ' - ' + hhmm(end);
      btnGo.disabled = true;
      btnRs.disabled = true;
      btnBk.disabled = true;
      if (rsUntil) disarm();

      if (!celebrated) {
        celebrated = true;
        void card.offsetWidth;
        card.classList.add('flash');
        confetti();
      }
    }
  }

  /* ------------------------------ κουμπιά ------------------------------ */
  btnGo.onclick = function () { if (!btnGo.disabled) { disarm(); doStart(); } };

  var rsFill = btnRs.querySelector('.fill');
  var rsUntil = 0, rsTick = null;

  function disarm() {
    rsUntil = 0;
    clearTimeout(rsTick); rsTick = null;
    btnRs.classList.remove('armed');
    rsFill.style.transition = 'none';
    rsFill.style.transform = 'scaleX(0)';
  }

  function arm() {
    rsUntil = Date.now() + 10000;
    btnRs.classList.add('armed');
    rsFill.style.transition = 'none';
    rsFill.style.transform = 'scaleX(1)';
    void rsFill.offsetWidth;
    rsFill.style.transition = 'transform 10s linear';
    rsFill.style.transform = 'scaleX(0)';
    clearTimeout(rsTick);
    rsTick = setTimeout(disarm, 10000);
  }

  btnRs.onclick = function () {
    if (btnRs.disabled) return;
    if (rsUntil && Date.now() < rsUntil) { disarm(); doReset(); }
    else arm();
  };

  /* ---------------- οθόνη ρυθμίσεων ---------------- */
  var setSheet = document.getElementById('setsheet');
  var bannerImg= document.getElementById('bannerImg');
  var logoPrev = document.getElementById('logoPrev');

  function applyLogo() {
    var l = flagGet('logo');
    bannerImg.src = l || 'brand.png';
    logoPrev.src  = l || 'brand.png';
  }

  /* η νέα εικόνα μένει στο πρόχειρο - στο banner μπαίνει μόνο με Αποθήκευση */
  window.__logoReady = function () {
    var fresh = flagGet('logo_new');
    flagSet('logo_new', '');
    if (!fresh || !DRAFT) return;
    DRAFT.logo = fresh;
    logoPrev.src = fresh;
  };

  function hhmmShift(sec) {
    return Math.floor(sec / 3600) + ':' + two(Math.round(sec % 3600 / 60));
  }

  var DRAFT = null;   // ό,τι αλλάζεις ζει εδώ μέχρι να πατήσεις Αποθήκευση

  function renderSettings() {
    var locked = !!st.start, D = DRAFT || SET;
    document.getElementById('shNum').textContent = hhmmShift(D.shift);
    document.getElementById('bkNum').textContent = Math.round(D.brk / 60);

    sw('swBrk', D.brkOn); sw('swMP', D.hMP); sw('swAP', D.hAP); sw('sw2J', D.h2J);
    document.getElementById('brkRow').classList.toggle('off', !D.brkOn);

    ['shDown','shUp','bkDown','bkUp','swBrk','swMP','swAP','sw2J','logoPick','logoReset','setSave']
      .forEach(function (id) { document.getElementById(id).disabled = locked; });
    document.getElementById('bkDown').disabled = locked || !D.brkOn;
    document.getElementById('bkUp').disabled   = locked || !D.brkOn;
    document.getElementById('setLock').hidden  = !locked;
  }
  function sw(id, on) { document.getElementById(id).classList.toggle('on', !!on); }

  function bumpShift(step) {
    DRAFT.shift = Math.min(9 * 3600, Math.max(7 * 3600, DRAFT.shift + step * 300));  // ανά 5'
    renderSettings();
  }
  function bumpBreak(step) {
    if (!DRAFT.brkOn) return;
    DRAFT.brk = Math.min(60 * 60, Math.max(10 * 60, DRAFT.brk + step * 60));         // ανά 1'
    renderSettings();
  }

  /* πάτημα για ένα βήμα, κράτημα για γρήγορη κύλιση */
  function repeatOn(el, fn) {
    var t1 = null, t2 = null;
    function start(e) {
      if (el.disabled) return;
      if (e && e.type === 'touchstart') e.preventDefault();
      fn();
      t1 = setTimeout(function () { t2 = setInterval(fn, 90); }, 420);
    }
    function stop() { clearTimeout(t1); clearInterval(t2); }
    el.addEventListener('touchstart', start);
    el.addEventListener('mousedown', start);
    ['touchend','touchcancel','mouseup','mouseleave'].forEach(function (ev) { el.addEventListener(ev, stop); });
  }
  repeatOn(document.getElementById('shDown'), function () { bumpShift(-1); });
  repeatOn(document.getElementById('shUp'),   function () { bumpShift(1); });
  repeatOn(document.getElementById('bkDown'), function () { bumpBreak(-1); });
  repeatOn(document.getElementById('bkUp'),   function () { bumpBreak(1); });

  document.getElementById('btnGear').onclick = function () {
    DRAFT = JSON.parse(JSON.stringify(SET));
    renderSettings();
    setSheet.hidden = false;
  };
  document.getElementById('setClose').onclick = function () {   // άκυρο
    DRAFT = null;
    applyLogo();                                  // γυρίζει και η εικόνα όπως ήταν
    setSheet.hidden = true;
  };
  document.getElementById('setSave').onclick = function () {
    if (!DRAFT) return;
    if (typeof DRAFT.logo === 'string') flagSet('logo', DRAFT.logo);
    delete DRAFT.logo;
    SET = DRAFT; DRAFT = null;
    saveSettings();
    applyLogo();
    setSheet.hidden = true;
  };

  function toggle(id, key) {
    document.getElementById(id).onclick = function () {
      if (this.disabled) return;
      DRAFT[key] = !DRAFT[key];
      renderSettings();
    };
  }
  toggle('swBrk', 'brkOn'); toggle('swMP', 'hMP'); toggle('swAP', 'hAP'); toggle('sw2J', 'h2J');

  document.getElementById('logoPick').onclick = function () {
    if (A && A.pickLogo) A.pickLogo();
  };
  document.getElementById('logoReset').onclick = function () {
    if (this.disabled || !DRAFT) return;
    DRAFT.logo = '';
    logoPrev.src = 'brand.png';
  };

  /* ---------------- οθόνη αδειών: χειρισμός ---------------- */
  var sheet     = document.getElementById('sheet');
  var paneList  = document.getElementById('paneList');
  var paneForm  = document.getElementById('paneForm');
  var paneEnt   = document.getElementById('paneEnt');
  var sheetTtl  = document.getElementById('sheetTitle');
  var listEl    = document.getElementById('leaveList');
  var totAllEl  = document.getElementById('totAll');
  var totRestEl = document.getElementById('totRest');
  var entWarn   = document.getElementById('entWarn');
  var fFrom     = document.getElementById('fFrom');
  var fTo       = document.getElementById('fTo');
  var fChips    = document.getElementById('fChips');
  var fDays     = document.getElementById('fDays');
  var fDaysTx   = document.getElementById('fDaysTx');
  var fFromLbl  = document.getElementById('fFromLbl');
  var fToLbl    = document.getElementById('fToLbl');
  var fErr      = document.getElementById('fErr');
  var entNum    = document.getElementById('entNum');

  var formType = 'plain', entVal = 20, delArm = 0, delTimer = null, shakeRest = false;
  var tip = document.getElementById('tip'), tipTimer = null;

  function showTip(el, text) {
    tip.textContent = text;
    tip.hidden = false;
    var r = el.getBoundingClientRect(), t = tip.getBoundingClientRect();
    var left = r.left + (r.width - t.width) / 2;
    left = Math.max(8, Math.min(left, window.innerWidth - t.width - 8));
    var top = r.top - t.height - 8;
    if (top < 8) top = r.bottom + 8;
    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
  }
  function hideTip() { clearTimeout(tipTimer); tip.hidden = true; }

  function pane(which) {
    paneList.hidden = which !== 'list';
    paneForm.hidden = which !== 'form';
    paneEnt.hidden  = which !== 'ent';
    document.getElementById('sheetClose').hidden = which !== 'list';
    sheetTtl.textContent = which === 'form' ? 'Νέα άδεια'
                         : which === 'ent'  ? 'Σύνολο - ' + new Date().getFullYear()
                         : 'Οι άδειές μου';
  }

  function renderLeaves() {
    var y = new Date().getFullYear(), t = totalsFor(y);
    totAllEl.textContent  = t.used;
    totRestEl.textContent = t.rest;

    var restBox = totRestEl.parentNode;
    restBox.classList.toggle('over', t.rest < 0);
    if (t.rest < 0 && shakeRest) {
      shakeRest = false;
      restBox.classList.remove('shake');
      void restBox.offsetWidth;
      restBox.classList.add('shake');
    }

    if (!entitle[y]) {
      entWarn.hidden = false;
      entWarn.textContent = 'Δεν έχεις ορίσει μέρες για το ' + y + ' — πάτα τον μετρητή δίπλα.';
    } else entWarn.hidden = true;

    if (!leaves.length) {
      listEl.innerHTML = '<div class="empty">Καμία άδεια δηλωμένη</div>';
      return;
    }

    var sorted = leaves.slice().sort(function (a, b) { return a.from < b.from ? -1 : 1; });
    var html = '';
    for (var i = 0; i < sorted.length; i++) {
      var lv = sorted[i], tp = ltype(lv.type), d = workDays(lv.from, lv.to);
      html += '<div class="lrow" data-full="' + humanFull(lv.from, lv.to) + '">'
            +   '<span class="lico" style="background:' + tp.bg + ';color:' + tp.col + '">' + tp.icon + '</span>'
            +   '<span class="lmain">'
            +     '<span class="ldate">' + human(lv.from, lv.to) + '</span>'
            +     '<span class="lsep">🔵</span>'
            +     '<span class="lsub" style="color:' + tp.col + '">' + d + (d === 1 ? ' ημέρα' : ' ημέρες') + '</span>'
            +   '</span>'
            +   '<button class="ldel' + (delArm === lv.id ? ' arm' : '') + '" data-id="' + lv.id + '">'
            +     (delArm === lv.id ? '✓' : '🗑') + '</button>'
            + '</div>';
    }
    listEl.innerHTML = html;

    var rows = listEl.querySelectorAll('.lrow');
    for (var r = 0; r < rows.length; r++) {
      (function (row) {
        var full = row.getAttribute('data-full');
        function down() {
          clearTimeout(tipTimer);
          tipTimer = setTimeout(function () { showTip(row, full); }, 420);
        }
        row.addEventListener('touchstart', down, { passive: true });
        row.addEventListener('mousedown', down);
        ['touchend','touchcancel','touchmove','mouseup','mouseleave'].forEach(function (ev) {
          row.addEventListener(ev, hideTip);
        });
      })(rows[r]);
    }

    var dels = listEl.querySelectorAll('.ldel');
    for (var k = 0; k < dels.length; k++) {
      dels[k].onclick = function () {
        var id = +this.getAttribute('data-id');
        clearTimeout(delTimer);
        if (delArm === id) {
          for (var j = 0; j < leaves.length; j++) if (leaves[j].id === id) { leaves.splice(j, 1); break; }
          delArm = 0;
          saveLeaveData();
          shownDay = null;
          renderLeaves();
        } else {
          delArm = id;
          renderLeaves();
          delTimer = setTimeout(function () { delArm = 0; renderLeaves(); }, 5000);
        }
      };
    }
  }

  function renderChips() {
    var html = '';
    for (var i = 0; i < LTYPES.length; i++) {
      var t = LTYPES[i], on = t.id === formType;
      html += '<div class="chip' + (on ? ' on' : '') + '" data-t="' + t.id + '"'
            + (on ? ' style="border-color:' + t.col + ';background:' + t.bg + ';color:' + t.col + '"' : '')
            + '>' + t.icon + '<span class="ctx">' + (t.short || t.name) + '</span></div>';
    }
    fChips.innerHTML = html;
    var chips = fChips.querySelectorAll('.chip');
    for (var k = 0; k < chips.length; k++) {
      chips[k].onclick = function () { formType = this.getAttribute('data-t'); renderChips(); };
    }
  }

  function nextWorkday(d) {
    var x = new Date(d.getTime());
    while (isWeekend(x)) x.setDate(x.getDate() + 1);
    return x;
  }

  function grDate(iso) {
    if (!iso) return '';
    var a = iso.split('-');
    return a[2] + '/' + a[1] + '/' + a[0];
  }
  function stampLabels() {
    fFromLbl.textContent = grDate(fFrom.value);
    fToLbl.textContent   = grDate(fTo.value);
  }

  function checkForm() {
    stampLabels();
    var ok = true;
    fErr.hidden = true;
    fFrom.classList.remove('bad');
    fTo.classList.remove('bad');

    if (!fFrom.value || !fTo.value) ok = false;
    if (ok && isWeekend(dparse(fFrom.value))) { fFrom.classList.add('bad'); ok = false; }
    if (ok && isWeekend(dparse(fTo.value)))   { fTo.classList.add('bad');   ok = false; }
    if (ok && dparse(fTo.value) < dparse(fFrom.value)) { fTo.classList.add('bad'); ok = false; }

    var n = ok ? workDays(fFrom.value, fTo.value) : 0;
    fDays.textContent = n;
    fDaysTx.textContent = n === 1 ? 'Ημέρα' : 'Ημέρες';
    return ok;
  }

  function openForm() {
    var t = nextWorkday(new Date()), iso = ymd(t);
    var nx = nextWorkday(new Date(t.getTime() + 86400000));
    fFrom.value = iso; fTo.value = ymd(nx);
    formType = 'plain';
    renderChips();
    checkForm();
    pane('form');
  }

  btnPto.onclick = function () {
    if (btnPto.disabled) return;
    loadLeaveData();
    shakeRest = true;
    renderLeaves();
    pane('list');
    sheet.hidden = false;
  };

  document.getElementById('sheetClose').onclick = function () {
    sheet.hidden = true; delArm = 0; hideTip();
  };
  document.getElementById('btnAddLeave').onclick = openForm;
  document.getElementById('fCancel').onclick = function () { renderLeaves(); pane('list'); };
  fFrom.onchange = function () {
    /* το «Έως» ακολουθεί το «Από», ώστε ο επιλογέας να ανοίγει στον σωστό μήνα */
    if (fFrom.value && !isWeekend(dparse(fFrom.value))) {
      var nx = dparse(fFrom.value);
      nx.setDate(nx.getDate() + 1);
      nx = nextWorkday(nx);
      if (!fTo.value || dparse(fTo.value) <= dparse(fFrom.value)) fTo.value = ymd(nx);
    }
    checkForm();
  };
  fTo.onchange = checkForm;

  document.getElementById('fSave').onclick = function () {
    if (!checkForm()) {
      fErr.hidden = false;
      fErr.textContent = 'Διάλεξε έγκυρες ημερομηνίες - όχι Σαββατοκύριακο.';
      return;
    }
    if (overlaps(fFrom.value, fTo.value)) {
      fErr.hidden = false;
      fErr.textContent = 'Υπάρχει ήδη άδεια σε αυτές τις ημερομηνίες.';
      return;
    }
    leaves.push({ id: Date.now(), from: fFrom.value, to: fTo.value, type: formType });
    saveLeaveData();
    shownDay = null;
    renderLeaves();
    pane('list');
  };

  /* μετρητής δικαιούμενων, μόνο με βελάκια */
  function openEnt() {
    var y = new Date().getFullYear();
    entVal = entitle[y] || 20;
    entNum.textContent = entVal;
    pane('ent');
  }
  function bump(step) {
    entVal = Math.min(30, Math.max(1, entVal + step));
    entNum.textContent = entVal;
  }
  function holdable(el, step) {
    var t1 = null, t2 = null;
    function start() {
      bump(step);
      t1 = setTimeout(function () { t2 = setInterval(function () { bump(step); }, 90); }, 450);
    }
    function stop() { clearTimeout(t1); clearInterval(t2); }
    el.addEventListener('touchstart', function (e) { e.preventDefault(); start(); });
    el.addEventListener('mousedown', start);
    ['touchend','touchcancel','mouseup','mouseleave'].forEach(function (ev) { el.addEventListener(ev, stop); });
  }
  holdable(document.getElementById('entUp'), 1);
  holdable(document.getElementById('entDown'), -1);

  document.getElementById('btnEnt').onclick = openEnt;
  entWarn.onclick = openEnt;
  document.getElementById('entCancel').onclick = function () { renderLeaves(); pane('list'); };
  document.getElementById('entSave').onclick = function () {
    entitle[new Date().getFullYear()] = entVal;
    saveLeaveData();
    renderLeaves();
    pane('list');
  };

  document.getElementById('popOk').onclick = function () {
    infoOpen = false;
    var k = pendingPop();
    if (k === 'end') st.popEnd = 2;
    else if (k === 'brk') st.popBrk = 2;
    save();
    pop.hidden = true;
  };
  window.__wake = function () { render(); };

  function closeAsk(){ ask.hidden = true; }
  btnBk.onclick = function () { if (!btnBk.disabled) ask.hidden = false; };
  document.getElementById('askNo').onclick  = closeAsk;
  document.getElementById('askYes').onclick = function () { closeAsk(); disarm(); doBreak(); };
  ask.addEventListener('click', function (e) { if (e.target === ask) closeAsk(); });

  /* --- δοκιμή notification: κράτα πατημένη την κεφαλίδα 1,5" --- */
  (function () {
    var head = document.querySelector('.head'), timer = null;
    function down() {
      timer = setTimeout(function () {
        if (!A || !A.schedule) return;
        A.schedule(9, String(Date.now() + 15000), 'Δοκιμή ειδοποίησης',
                   'Αν το βλέπεις, τα notifications παίζουν κανονικά.');
        var old = elState.innerHTML;
        elState.textContent = 'Δοκιμή σε 15 δευτερόλεπτα…';
        setTimeout(function () { elState.innerHTML = old; }, 6000);
      }, 1500);
    }
    function up() { clearTimeout(timer); }
    head.addEventListener('touchstart', down, { passive: true });
    head.addEventListener('mousedown', down);
    ['touchend','touchcancel','mouseup','mouseleave'].forEach(function (e) {
      head.addEventListener(e, up);
    });
  })();

  loadLeaveData();
  loadSettings();
  applyLogo();
  st = load();
  if (st.start && now() >= st.start + SHIFT) celebrated = false;
  render();

  /* η δοκιμαστική γιορτή παίζει μία φορά και καταναλώνεται */
  if (flagGet('holitest') === '1') {
    flagSet('holitest', '');
    showHoliday();
  }
  setInterval(render, 500);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) {
      var t = new Date();
      playMood(t.getDay());
      peek = false;
      var lvt = leaveOn(ymd(t));
      if (lvt) celebrate(ltype(lvt.type).kind);
      else if (hol(ymd(t))) celebrate(hol(ymd(t)));
      else if (t.getDay() === 0 || t.getDay() === 6) showWeekend();
      else if (flagGet('holitest') === '1') { flagSet('holitest', ''); showHoliday(); }
      render();
    }
  });

  /* ------------------ confetti, μόνο μέσα στο card ------------------ */
  function confetti() {
    var cv = document.getElementById('confetti');
    var w = card.clientWidth, h = card.clientHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = w * dpr; cv.height = h * dpr;
    var ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var colors = ['#4ade80','#f0b429','#58b0c8','#f472b6','#e7eaf0'];
    var bits = [];
    for (var i = 0; i < 70; i++) {
      bits.push({
        x: Math.random() * w, y: -10 - Math.random() * h * 0.9,
        vx: (Math.random() - 0.5) * 0.7, vy: 0.9 + Math.random() * 1.7,
        s: 3 + Math.random() * 4, r: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.22, sw: 0.4 + Math.random() * 0.6,
        c: colors[(Math.random() * colors.length) | 0]
      });
    }

    var t0 = performance.now();
    (function frame(t) {
      var age = t - t0;
      ctx.clearRect(0, 0, w, h);
      ctx.globalAlpha = age > 2600 ? Math.max(0, 1 - (age - 2600) / 900) : 1;
      for (var i = 0; i < bits.length; i++) {
        var b = bits[i];
        b.x += b.vx + Math.sin((age / 400) + b.r) * 0.25;
        b.y += b.vy; b.r += b.vr; b.vy += 0.013;
        ctx.save();
        ctx.translate(b.x, b.y); ctx.rotate(b.r);
        ctx.scale(1, Math.abs(Math.cos(age / 260 * b.sw)) * 0.8 + 0.2);
        ctx.fillStyle = b.c;
        ctx.fillRect(-b.s / 2, -b.s / 2, b.s, b.s * 0.62);
        ctx.restore();
      }
      if (age < 3600) requestAnimationFrame(frame);
      else ctx.clearRect(0, 0, w, h);
    })(t0);
  }
})();
