<!doctype html>
<!-- Work TimeSheet · Android build · v1.3.0 · Last update: 25/09/2026 14:24 (ώρα Ελλάδας) -->
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Work TimeSheet</title>
<style>
  :root{
    --bg:#0b0d12; --card:#151922; --line:#242a36; --label:#8e97a6; --dim:#5d6575;
    --value:#f0b429; --ok:#4ade80; --soft:#7fae92; --brk:#58b0c8;
    box-sizing:border-box;
  }
  *,*::before,*::after{box-sizing:inherit}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:#e7eaf0;
    font:400 15px/1.35 -apple-system,BlinkMacSystemFont,Roboto,"Segoe UI",sans-serif;
    -webkit-tap-highlight-color:transparent;
    display:flex;align-items:center;justify-content:center;padding:16px;
    touch-action:manipulation;
  }

  .card{
    position:relative;overflow:hidden;width:320px;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:0 14px 12px;
    transition:border-color .5s ease,box-shadow .5s ease;
    user-select:none;-webkit-user-select:none;
  }

  /* --- banner + κεφαλίδα --- */
  .banner{
    margin:0 -14px;
    padding:14px 0 11px;
    border-bottom:1px solid var(--line);
  }
  .banner img{
    display:block;width:84%;max-width:250px;height:auto;margin:0 auto;
  }
  .head{
    position:relative;
    display:flex;align-items:center;
    min-height:70px;
    padding:8px 0 9px;margin-bottom:2px;
    border-bottom:1px solid var(--line);
  }
  .head .worker{
    position:absolute;left:2px;top:50%;transform:translateY(-50%);
    height:54px;width:auto;z-index:1;opacity:.95;
  }
  .daybox{
    position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
    text-align:center;
  }
  .daybox canvas{
    position:absolute;left:0;top:-4px;width:100%;height:104px;
    pointer-events:none;z-index:3;
  }
  .day{
    position:relative;left:20px;z-index:2;display:inline-block;
    font-size:25px;font-weight:900;letter-spacing:.4px;line-height:1.2;
    color:#e7eaf0;transition:color .4s ease,text-shadow .4s ease;
  }

  /* διάθεση της ημέρας */
  .day.d-mon{color:#ff2b2b;text-shadow:0 0 14px rgba(255,43,43,.6),0 0 28px rgba(255,43,43,.25)}
  .day.d-tue{color:#ff8a80;text-shadow:0 0 10px rgba(255,138,128,.38)}
  .day.d-wed{color:#f0b429;text-shadow:0 0 10px rgba(240,180,41,.35)}
  .day.d-thu{color:#9fe0b4;text-shadow:0 0 10px rgba(159,224,180,.3)}
  .day.d-fri{color:#22e06a;text-shadow:0 0 16px rgba(34,224,106,.75),0 0 34px rgba(34,224,106,.35)}
  .day.d-sat,.day.d-sun{color:#5ad7a0;text-shadow:0 0 12px rgba(90,215,160,.4)}
  /* αργία: πανηγύρι πάνω από όλη την οθόνη */
  .holiday{
    position:fixed;inset:0;z-index:50;
    display:flex;align-items:center;justify-content:center;
    background:rgba(7,9,13,.9);
    -webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);
    animation:fade .4s ease-out;
  }
  .holiday[hidden]{display:none}
  .holiday canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .holiday img{
    position:relative;z-index:2;
    width:80%;max-width:330px;height:auto;
    border-radius:20px;
    box-shadow:0 0 0 2px rgba(245,196,81,.4),
               0 20px 55px rgba(0,0,0,.65),
               0 0 70px rgba(245,196,81,.28);
    animation:holiIn .55s cubic-bezier(.2,.9,.3,1.25) both,
              holiShake .46s ease-in-out .5s 3;
  }
  @keyframes holiIn{
    from{opacity:0;transform:scale(.8) translateY(14px)}
    to{opacity:1;transform:none}
  }
  @keyframes holiShake{
    0%,100%{transform:rotate(0) scale(1)}
    25%{transform:rotate(-2.4deg) scale(1.015)}
    75%{transform:rotate(2.4deg) scale(1.015)}
  }
  .day.shake{animation:dayshake .42s ease-in-out 0s 5}
  @keyframes dayshake{
    0%,100%{transform:translateX(0) rotate(0)}
    20%{transform:translateX(-3px) rotate(-1.6deg)}
    45%{transform:translateX(3px) rotate(1.6deg)}
    70%{transform:translateX(-2px) rotate(-1deg)}
  }

  .row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:5px 0}
  .row .k{color:var(--label);font-weight:600}
  .row .v{color:var(--value);font-weight:700;font-variant-numeric:tabular-nums;font-size:19px}
  .rest .v{font-size:26px;line-height:1.1;transition:color .6s ease,text-shadow .6s ease}
  .rcolon{transition:opacity .12s linear}
  .rcolon.off{opacity:.15}
  .rest .v.hot{color:#ff3b30;text-shadow:0 0 12px rgba(255,59,48,.6),0 0 24px rgba(255,59,48,.25)}
  .rest .v.warm{color:#ef8a84;text-shadow:0 0 8px rgba(239,138,132,.28)}
  .rest .v.soon{color:var(--value);text-shadow:none}
  .endr .v{color:var(--soft);font-weight:600}
  .colon{transition:opacity .12s linear}
  .colon.off{opacity:.18}

  .brkbox{
    margin:8px -4px 2px;padding:6px 8px 4px;border-radius:9px;
    background:rgba(88,176,200,.08);border:1px solid rgba(88,176,200,.22);
  }
  .brkbox[hidden]{display:none}
  .brkbox .k{color:#8fbecb}
  .brkbox .v{color:var(--brk)}
  .brkbox .count .v{font-size:22px}

  .sep{height:1px;background:var(--line);margin:10px -2px 8px}
  .state{color:var(--label);font-size:13.5px;min-height:19px;font-weight:600}
  .sub{color:var(--dim);font-size:12.5px;margin-top:3px;min-height:16px}
  .legend{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:12.5px;margin-top:4px}
  .legend[hidden]{display:none}
  .legend .dot{width:6px;height:6px;border-radius:50%;background:var(--brk);flex:none}

  .btns{display:flex;gap:8px;margin-top:12px}
  button{
    flex:1;font:inherit;font-weight:600;font-size:14px;color:#dfe4ec;
    background:#1d2330;border:1px solid var(--line);border-radius:9px;padding:9px 10px;
    -webkit-appearance:none;transition:background .15s ease,opacity .15s ease;
  }
  button .ic{font-size:40px;line-height:1}
  #btnReset{padding:3px;line-height:1}
  button.go{
    display:flex;align-items:center;justify-content:center;
    padding:4px;
    background:#8fd9a8;
    border-color:#8fd9a8;
    transition:background .12s ease,border-color .12s ease,filter .2s ease,opacity .2s ease;
  }
  button.go img{display:block;height:46px;width:auto;pointer-events:none}
  button.go img[hidden]{display:none}
  button.go:active:not(:disabled){
    color:#eafff2;
    background:#1c6b3d;
    border-color:#1c6b3d;
  }
  button.go:disabled{
    background:#33607f;
    border-color:#33607f;
    filter:grayscale(.35);
    opacity:.78;
  }

  #btnReset{position:relative;overflow:hidden}
  #btnReset.armed{background:#7a2030;border-color:#c04358}
  #btnReset .fill{
    position:absolute;left:0;bottom:0;height:3px;width:100%;
    background:#ff7183;transform:scaleX(0);transform-origin:left;
  }

  button.brkbtn{
    width:100%;margin-top:8px;display:flex;align-items:center;justify-content:center;
    padding:4px;color:#e6f6fb;background:#1b5064;border-color:#276b83;
  }
  button.brkbtn img{display:block;height:38px;width:auto;pointer-events:none}
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.32}

  .ver{
    margin-top:11px;
    display:flex;align-items:center;justify-content:center;gap:18px;
    font-size:11.5px;letter-spacing:.3px;color:#858d9c;
  }
  .ver .tagico{font-size:12px;line-height:1}
  .ver.armed{color:#f5c451;transition:color .2s ease}

  .done{border-color:rgba(74,222,128,.45)}
  .done .row .v,.done .state{color:var(--ok)}
  .done .state{font-size:18px;font-weight:800;letter-spacing:.4px;animation:textglow 2.4s ease-in-out infinite}
  .done .state .party{font-size:21px;margin-left:10px;vertical-align:-1px;text-shadow:none}
  .done.pop{animation:glow 1.6s ease-out 2}
  @keyframes textglow{
    0%,100%{text-shadow:0 0 8px rgba(74,222,128,.35)}
    50%{text-shadow:0 0 16px rgba(74,222,128,.7),0 0 30px rgba(74,222,128,.28)}
  }
  @keyframes glow{
    0%{box-shadow:0 0 0 0 rgba(74,222,128,0)}
    35%{box-shadow:0 0 22px 2px rgba(74,222,128,.28)}
    100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}
  }

  canvas#confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}

  .pop{
    position:absolute;inset:0;z-index:12;
    display:flex;align-items:center;justify-content:center;
    padding:16px;background:rgba(9,11,16,.9);
    backdrop-filter:blur(4px);animation:fade .18s ease-out;
  }
  .pop[hidden]{display:none}
  .pop-in{width:100%;text-align:center;animation:rise .2s ease-out}
  .pop-in p{
    margin:0 0 14px;font-size:19px;font-weight:800;line-height:1.35;color:#e7eaf0;
  }
  .pop-in p.win{color:var(--ok);text-shadow:0 0 14px rgba(74,222,128,.55)}
  .pop-in p.brk{color:var(--brk);text-shadow:0 0 12px rgba(88,176,200,.45)}
  .pop-in button{width:100%;font-size:15px;padding:11px;background:#1d2330}

  .ask{
    position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
    padding:14px;background:rgba(9,11,16,.86);backdrop-filter:blur(3px);animation:fade .16s ease-out;
  }
  .ask[hidden]{display:none}
  .ask-in{width:100%;text-align:center;animation:rise .18s ease-out}
  .ask-in p{margin:0 0 12px;font-size:14.5px;font-weight:600;color:#e7eaf0}
  .ask-b{display:flex;gap:8px}
  .ask-b .yes{color:#06222b;background:var(--brk);border-color:var(--brk)}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<div class="holiday" id="holiday" hidden>
  <canvas id="balloons"></canvas>
  <img id="holiimg" src="holiday.png" alt="">
</div>

<div class="card" id="card">
  <canvas id="confetti"></canvas>

  <div class="banner"><img src="flexo.png" alt="Flexopack"></div>

  <div class="head">
    <img class="worker" src="worker.png" alt="">
    <div class="daybox" id="daybox">
      <canvas id="fx"></canvas>
      <span class="day" id="day">&nbsp;</span>
    </div>
  </div>

  <div class="row rest">
    <span class="k">Υπόλοιπο</span>
    <span class="v" id="rest">--<span class="rcolon" id="rcolon">:</span>--</span>
  </div>

  <div class="row endr">
    <span class="k">Σχόλασμα</span>
    <span class="v" id="endtime">--:--</span>
  </div>

  <div class="brkbox" id="brkbox" hidden>
    <div class="row count">
      <span class="k">Διάλειμμα</span>
      <span class="v" id="brkleft">25:00</span>
    </div>
    <div class="row">
      <span class="k">Λήγει</span>
      <span class="v" id="brkend">--:--</span>
    </div>
  </div>

  <div class="sep"></div>

  <div class="state" id="state">&nbsp;</div>
  <div class="sub" id="sub">&nbsp;</div>
  <div class="legend" id="legend" hidden><span class="dot"></span><span id="legendtx"></span></div>

  <div class="btns">
    <button class="go" id="btnStart" aria-label="Έναρξη βάρδιας">
      <img id="imgIdle" src="work.png" alt="">
      <img id="imgRun" src="working.png" alt="" hidden>
    </button>
    <button id="btnReset" aria-label="Reset"><span class="ic">♻️</span><i class="fill"></i></button>
  </div>
  <button class="brkbtn" id="btnBreak" aria-label="Διάλειμμα"><img src="food.png" alt=""></button>

  <div class="ver" id="ver"><span class="tagico">🏷️</span><span>v1.3.0</span></div>

  <div class="pop" id="pop" hidden>
    <div class="pop-in">
      <p id="poptx"></p>
      <button id="popOk">OK</button>
    </div>
  </div>

  <div class="ask" id="ask" hidden>
    <div class="ask-in">
      <p>Να ξεκινήσω διάλειμμα;</p>
      <div class="ask-b">
        <button id="askNo">Όχι</button>
        <button class="yes" id="askYes">Ναι</button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  var SHIFT  = 8 * 3600 + 30 * 60;   // 8:30 βάρδια
  var BREAK  = 25 * 60;              // 25' διάλειμμα
  var CUTOFF = 27 * 60;              // νεκρή ζώνη στην αρχή και στο τέλος
  var KEY    = 'work-shift';
  var DAYS   = ['Κυριακή','Δευτέρα','Τρίτη','Τετάρτη','Πέμπτη','Παρασκευή','Σάββατο'];

  var card     = document.getElementById('card');
  var elDay    = document.getElementById('day');
  var dayBox   = document.getElementById('daybox');
  var holiBox  = document.getElementById('holiday');
  var holiImg  = document.getElementById('holiimg');
  var holiCv   = document.getElementById('balloons');
  var fxCanvas = document.getElementById('fx');
  var elRest   = document.getElementById('rest');
  var rColon   = document.getElementById('rcolon');
  var elEnd    = document.getElementById('endtime');
  var brkBox   = document.getElementById('brkbox');
  var brkLeft  = document.getElementById('brkleft');
  var brkEndEl = document.getElementById('brkend');
  var elState  = document.getElementById('state');
  var elSub    = document.getElementById('sub');
  var legend   = document.getElementById('legend');
  var legendTx = document.getElementById('legendtx');
  var btnGo    = document.getElementById('btnStart');
  var btnRs    = document.getElementById('btnReset');
  var btnBk    = document.getElementById('btnBreak');
  var imgIdle  = document.getElementById('imgIdle');
  var imgRun   = document.getElementById('imgRun');
  var ask      = document.getElementById('ask');
  var pop      = document.getElementById('pop');
  var popTx    = document.getElementById('poptx');

  var A = window.Android || null;   // γέφυρα προς το Android
  var celebrated = false;
  var st;

  var POPTX = {
    brk: '👉 Το Διάλειμμα Τελείωσε   💼',
    end: '🥳  Σχόλασες! 🎉'
  };

  /* 0 = δεν συνέβη, 1 = εκκρεμεί, 2 = το είδα */
  function pendingPop() {
    if (st.popEnd === 1) return 'end';
    if (st.popBrk === 1) return 'brk';
    return null;
  }

  function showPop(kind) {
    popTx.textContent = POPTX[kind];
    popTx.className = kind === 'end' ? 'win' : 'brk';
    pop.hidden = false;
  }

  function two(n){ return (n < 10 ? '0' : '') + n; }
  function setRest(h, m) {
    elRest.childNodes[0].nodeValue = h;
    elRest.childNodes[2].nodeValue = m;
  }
  function now(){ return Date.now() / 1000; }
  function ymd(d){ return d.getFullYear() + '-' + two(d.getMonth() + 1) + '-' + two(d.getDate()); }
  function hhmm(ts){ var d = new Date(ts * 1000); return two(d.getHours()) + ':' + two(d.getMinutes()); }

  function load() {
    var raw = {};
    try { raw = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { raw = {}; }
    if (raw.date !== ymd(new Date())) return { date: null, start: null, brk: null, popBrk: 0, popEnd: 0 };
    return {
      date: raw.date, start: raw.start || null, brk: raw.brk || null,
      popBrk: raw.popBrk || 0, popEnd: raw.popEnd || 0
    };
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {}
  }

  /* ---- notifications μέσω AlarmManager ---- */
  function schedule(id, epochSec, title, body) {
    if (A && A.schedule) A.schedule(id, String(Math.round(epochSec * 1000)), title, body);
  }
  function cancel(id) { if (A && A.cancel) A.cancel(id); }

  function doStart() {
    var t = Math.floor(now());
    st = { date: ymd(new Date()), start: t, brk: null, popBrk: 0, popEnd: 0 };
    save();
    schedule(1, t + SHIFT, '🥳  Σχόλασες! 🎉', '');
    celebrated = false;
    render();
  }

  function doBreak() {
    var t = Math.floor(now());
    st.brk = t;
    st.popBrk = 0;
    save();
    schedule(2, t + BREAK, '👉 Το Διάλειμμα Τελείωσε   💼', '');
    render();
  }

  function doReset() {
    st = { date: null, start: null, brk: null, popBrk: 0, popEnd: 0 };
    save();
    cancel(1); cancel(2);
    pop.hidden = true;
    celebrated = false;
    card.classList.remove('pop');
    render();
  }

  /* ------------------------------ render ------------------------------ */
  /* ---------------- η ημέρα και η διάθεσή της ---------------- */
  var DAYCLS = ['d-sun','d-mon','d-tue','d-wed','d-thu','d-fri','d-sat'];

  /* υποχρεωτικές αργίες ιδιωτικού τομέα - χωρίς όσες πέφτουν Σαββατοκύριακο */
  var HOLIDAYS = {
    '2026-10-28': '🇬🇷 28η Οκτωβρίου',
    '2026-12-25': '🎄 Χριστούγεννα',
    '2027-01-01': '🎊 Πρωτοχρονιά',
    '2027-01-06': '⛪ Θεοφάνεια',
    '2027-03-15': '🪁 Καθαρά Δευτέρα',
    '2027-03-25': '🇬🇷 25η Μαρτίου',
    '2027-04-30': '🕯️ Μεγάλη Παρασκευή',
    '2027-05-03': '🐣 Δευτέρα του Πάσχα',
    '2027-06-21': '🕊️ Αγίου Πνεύματος',
    '2027-10-28': '🇬🇷 28η Οκτωβρίου'
  };
  var shownDay = null;

  function setDay(d) {
    var key = ymd(d), w = d.getDay(), holi = HOLIDAYS[key] || null;
    if (shownDay === key) return;
    shownDay = key;

    elDay.textContent = DAYS[w];
    elDay.className = 'day ' + DAYCLS[w];
    playMood(w);

    if (holi) showHoliday(); else holiBox.hidden = true;
  }

  var fxStop = null;

  function playMood(w) {
    if (fxStop) { fxStop(); fxStop = null; }
    elDay.classList.remove('shake');
    if (w === 1) fxStop = drips('#e01f28', 10000, 'blood');
    else if (w === 2) fxStop = drips('#8fd2f0', 10000, 'tear');
    else if (w === 5) {
      void elDay.offsetWidth;
      elDay.classList.add('shake');
      fxStop = fireworks(2100);
      setTimeout(function () { elDay.classList.remove('shake'); }, 2100);
    } else {
      var c = fxCanvas.getContext('2d');
      c.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
    }
  }

  /* ---------------- αργία: overlay + μπαλόνια ---------------- */
  var balloonStop = null;
  var TESTKEY = 'work-holitest';

  /* κρυφή δοκιμή: κράτα πατημένη την ετικέτα έκδοσης 1,5" -
     στο επόμενο άνοιγμα της εφαρμογής παίζει η γιορτή μία φορά */
  (function () {
    var ver = document.getElementById('ver'), timer = null;
    function down() {
      timer = setTimeout(function () {
        try { localStorage.setItem(TESTKEY, '1'); } catch (e) {}
        ver.classList.add('armed');
        setTimeout(function () { ver.classList.remove('armed'); }, 1400);
      }, 1500);
    }
    function up() { clearTimeout(timer); }
    ver.addEventListener('touchstart', down, { passive: true });
    ver.addEventListener('mousedown', down);
    ['touchend','touchcancel','mouseup','mouseleave'].forEach(function (e) {
      ver.addEventListener(e, up);
    });
  })();

  function showHoliday() {
    holiBox.hidden = false;
    /* ξαναπαίζουμε τα animation της εικόνας από την αρχή */
    holiImg.style.animation = 'none';
    void holiImg.offsetWidth;
    holiImg.style.animation = '';
    if (balloonStop) balloonStop();
    balloonStop = balloons(2000);
  }

  /* μπαλόνια σε όλη την οθόνη, σπορά για 2 δευτερόλεπτα */
  function balloons(spawnMs) {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = window.innerWidth, h = window.innerHeight;
    holiCv.width = w * dpr; holiCv.height = h * dpr;
    var ctx = holiCv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var cols = ['#e63946','#f5c451','#3fa9f5','#42d17a','#c86bfa','#ff8fab'];
    var list = [], t0 = performance.now(), raf = null, alive = true;

    function spawn() {
      var r = 13 + Math.random() * 12;
      list.push({
        x: Math.random() * w, y: -r * 2.4 - Math.random() * 120,
        r: r, v: 0.9 + Math.random() * 1.5,
        sw: Math.random() * 6.283, ss: 0.012 + Math.random() * 0.02,
        c: cols[(Math.random() * cols.length) | 0], tilt: (Math.random() - .5) * .5
      });
    }
    for (var i = 0; i < 10; i++) spawn();

    (function frame(t) {
      if (!alive) return;
      var age = t - t0;
      ctx.clearRect(0, 0, w, h);
      if (age < spawnMs && Math.random() < 0.5) spawn();

      for (var i = list.length - 1; i >= 0; i--) {
        var b = list[i];
        b.y += b.v; b.sw += b.ss;
        var x = b.x + Math.sin(b.sw) * 16, r = b.r;

        ctx.save();
        ctx.translate(x, b.y);
        ctx.rotate(Math.sin(b.sw) * .12 + b.tilt);

        ctx.strokeStyle = 'rgba(255,255,255,.45)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, r * 1.25);
        ctx.quadraticCurveTo(r * .5, r * 2, 0, r * 2.7);
        ctx.stroke();

        ctx.fillStyle = b.c;
        ctx.beginPath();
        ctx.ellipse(0, 0, r * .82, r, 0, 0, 6.283);
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,.35)';
        ctx.beginPath();
        ctx.ellipse(-r * .28, -r * .34, r * .18, r * .28, -.4, 0, 6.283);
        ctx.fill();

        ctx.fillStyle = b.c;
        ctx.beginPath();
        ctx.moveTo(-r * .16, r * 1.02);
        ctx.lineTo(r * .16, r * 1.02);
        ctx.lineTo(0, r * 1.3);
        ctx.fill();
        ctx.restore();

        if (b.y - r > h + 40) list.splice(i, 1);
      }

      if (age < spawnMs + 6000 && list.length) raf = requestAnimationFrame(frame);
      else ctx.clearRect(0, 0, w, h);
    })(t0);

    return function () { alive = false; if (raf) cancelAnimationFrame(raf); ctx.clearRect(0, 0, w, h); };
  }

  /* καμβάς ακριβώς πάνω από τη λέξη της ημέρας */
  function fxSetup() {
    var w = dayBox.clientWidth || 260, h = 104;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    fxCanvas.width = w * dpr; fxCanvas.height = h * dpr;
    var ctx = fxCanvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var r = elDay.getBoundingClientRect(), br = dayBox.getBoundingClientRect();
    var tw = r.width || 120;
    return { ctx: ctx, w: w, h: h, x0: r.left - br.left, tw: tw, base: elDay.offsetHeight - 4 };
  }

  /* σταγόνες που κυλούν από τα γράμματα */
  function drips(color, ms, kind) {
    var s = fxSetup(), drops = [], t0 = performance.now(), raf = null, alive = true;

    function spawn() {
      drops.push({
        x: s.x0 + Math.random() * s.tw,
        y: s.base - 6 + Math.random() * 4,
        v: 0, grow: 0, r: kind === 'tear' ? 2.0 : 2.4,
        hang: 220 + Math.random() * 500, born: performance.now()
      });
    }

    (function frame(t) {
      if (!alive) return;
      var age = t - t0;
      s.ctx.clearRect(0, 0, s.w, s.h);

      if (age < ms - 1200 && Math.random() < 0.055) spawn();

      for (var i = drops.length - 1; i >= 0; i--) {
        var d = drops[i];
        var life = t - d.born;
        if (life < d.hang) {
          d.grow = Math.min(1, life / d.hang);          // φουσκώνει πριν πέσει
        } else {
          d.v += 0.055; d.y += d.v;
        }
        var r = d.r * (0.45 + 0.55 * d.grow);
        var fade = d.y > s.h - 22 ? Math.max(0, (s.h - d.y) / 22) : 1;

        s.ctx.globalAlpha = fade * (age > ms - 900 ? Math.max(0, (ms - age) / 900) : 1);
        s.ctx.fillStyle = color;
        s.ctx.beginPath();
        s.ctx.moveTo(d.x, d.y - r * 1.7);
        s.ctx.quadraticCurveTo(d.x + r, d.y, d.x, d.y + r);
        s.ctx.quadraticCurveTo(d.x - r, d.y, d.x, d.y - r * 1.7);
        s.ctx.fill();
        if (kind === 'tear') {
          s.ctx.globalAlpha *= 0.55;
          s.ctx.fillStyle = '#eaf7ff';
          s.ctx.beginPath();
          s.ctx.arc(d.x - r * 0.3, d.y - r * 0.2, r * 0.3, 0, 6.3);
          s.ctx.fill();
        }
        if (d.y > s.h) drops.splice(i, 1);
      }
      s.ctx.globalAlpha = 1;

      if (age < ms) raf = requestAnimationFrame(frame);
      else s.ctx.clearRect(0, 0, s.w, s.h);
    })(t0);

    return function () { alive = false; if (raf) cancelAnimationFrame(raf); s.ctx.clearRect(0, 0, s.w, s.h); };
  }

  /* πυροτεχνήματα πάνω στη λέξη */
  function fireworks(ms, palette) {
    var s = fxSetup(), parts = [], t0 = performance.now(), raf = null, alive = true, next = 0;
    var cols = palette || ['#22e06a','#f0b429','#58b0c8','#ffffff','#f472b6'];

    function burst() {
      var cx = s.x0 + 10 + Math.random() * Math.max(10, s.tw - 20);
      var cy = 6 + Math.random() * (s.base - 2);
      var c = cols[(Math.random() * cols.length) | 0];
      for (var i = 0; i < 22; i++) {
        var a = Math.random() * 6.283, sp = 0.7 + Math.random() * 2.1;
        parts.push({ x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, c: c, born: performance.now() });
      }
    }

    (function frame(t) {
      if (!alive) return;
      var age = t - t0;
      s.ctx.clearRect(0, 0, s.w, s.h);
      if (age > next && age < ms - 400) { burst(); next = age + 340; }

      for (var i = parts.length - 1; i >= 0; i--) {
        var p = parts[i], life = t - p.born;
        p.x += p.vx; p.y += p.vy; p.vy += 0.035; p.vx *= 0.985;
        var a = Math.max(0, 1 - life / 900);
        if (a <= 0) { parts.splice(i, 1); continue; }
        s.ctx.globalAlpha = a;
        s.ctx.fillStyle = p.c;
        s.ctx.fillRect(p.x - 1.2, p.y - 1.2, 2.4, 2.4);
      }
      s.ctx.globalAlpha = 1;

      if (age < ms) raf = requestAnimationFrame(frame);
      else s.ctx.clearRect(0, 0, s.w, s.h);
    })(t0);

    return function () { alive = false; if (raf) cancelAnimationFrame(raf); s.ctx.clearRect(0, 0, s.w, s.h); };
  }

  /* έντονο κόκκινο στην αρχή, απαλότερο μετά τις 4 ώρες, κίτρινο στο τελευταίο 40λεπτο */
  function tone(left) {
    var cls = left <= 40 * 60 ? 'soon' : (left <= 4 * 3600 ? 'warm' : 'hot');
    if (elRest.className !== 'v ' + cls) elRest.className = 'v ' + cls;
  }

  function render() {
    var n = now();
    var d = new Date();

    if (st.date && st.date !== ymd(d)) { st = { date: null, start: null, brk: null }; save(); }

    setDay(d);

    var end     = st.start ? st.start + SHIFT : null;
    var brkEnd  = st.brk ? st.brk + BREAK : null;
    var running = !!st.start && n < end;
    var onBreak = !!st.brk && n < brkEnd;
    var hadBrk  = !!st.brk && n >= brkEnd;

    if (onBreak) {
      var bl = Math.max(0, Math.round(brkEnd - n));
      brkLeft.textContent  = two(Math.floor(bl / 60)) + ':' + two(bl % 60);
      brkEndEl.textContent = hhmm(brkEnd);
      brkBox.hidden = false;
    } else {
      brkBox.hidden = true;
    }

    if (hadBrk) {
      legend.hidden = false;
      legendTx.textContent = 'Διάλειμμα ' + hhmm(st.brk) + ' - ' + hhmm(brkEnd);
    } else {
      legend.hidden = true;
    }

    rColon.classList.toggle('off', running && d.getSeconds() % 2 === 1);

    /* μηνύματα μέσα στην εφαρμογή, όταν είναι ανοιχτή τη στιγμή που λήγει κάτι */
    if (!document.hidden) {
      if (hadBrk && !st.popBrk && (n - brkEnd) < 150) { st.popBrk = 1; save(); }
      if (!!st.start && n >= end && !st.popEnd && (n - end) < 150) { st.popEnd = 1; save(); }
    }

    var want = pendingPop();
    if (want && pop.hidden) showPop(want);
    else if (!want && !pop.hidden) pop.hidden = true;

    imgIdle.hidden = !!st.start;
    imgRun.hidden  = !st.start;

    btnBk.disabled = !running || !!st.brk
      || (n - st.start) < CUTOFF
      || (end - n) < CUTOFF;

    if (!st.start) {
      card.classList.remove('done', 'pop');
      setRest('08', '30');
      tone(SHIFT);
      elEnd.textContent  = '--:--';
      elState.innerHTML = '&nbsp;';
      elSub.innerHTML   = '&nbsp;';
      btnGo.disabled = false;
      btnRs.disabled = true;
      if (rsUntil) disarm();
      return;
    }

    elEnd.textContent = hhmm(end);

    if (running) {
      card.classList.remove('done', 'pop');
      var mins = Math.ceil((end - n) / 60);
      setRest(two(Math.floor(mins / 60)), two(mins % 60));
      tone(end - n);
      elState.textContent = 'Ξεκίνησες ' + hhmm(st.start);
      elSub.innerHTML     = '&nbsp;';
      btnGo.disabled = true;
      btnRs.disabled = false;
    } else {
      card.classList.add('done');
      setRest('00', '00');
      if (elState.firstElementChild === null) {
        elState.innerHTML = 'Σχόλασες<span class="party">🎉</span>';
      }
      elSub.textContent = hhmm(st.start) + ' - ' + hhmm(end);
      btnGo.disabled = true;
      btnRs.disabled = true;
      btnBk.disabled = true;
      if (rsUntil) disarm();

      if (!celebrated) {
        celebrated = true;
        void card.offsetWidth;
        card.classList.add('pop');
        confetti();
      }
    }
  }

  /* ------------------------------ κουμπιά ------------------------------ */
  btnGo.onclick = function () { if (!btnGo.disabled) { disarm(); doStart(); } };

  var rsFill = btnRs.querySelector('.fill');
  var rsUntil = 0, rsTick = null;

  function disarm() {
    rsUntil = 0;
    clearTimeout(rsTick); rsTick = null;
    btnRs.classList.remove('armed');
    rsFill.style.transition = 'none';
    rsFill.style.transform = 'scaleX(0)';
  }

  function arm() {
    rsUntil = Date.now() + 10000;
    btnRs.classList.add('armed');
    rsFill.style.transition = 'none';
    rsFill.style.transform = 'scaleX(1)';
    void rsFill.offsetWidth;
    rsFill.style.transition = 'transform 10s linear';
    rsFill.style.transform = 'scaleX(0)';
    clearTimeout(rsTick);
    rsTick = setTimeout(disarm, 10000);
  }

  btnRs.onclick = function () {
    if (btnRs.disabled) return;
    if (rsUntil && Date.now() < rsUntil) { disarm(); doReset(); }
    else arm();
  };

  document.getElementById('popOk').onclick = function () {
    var k = pendingPop();
    if (k === 'end') st.popEnd = 2;
    else if (k === 'brk') st.popBrk = 2;
    save();
    pop.hidden = true;
  };
  window.__wake = function () { render(); };

  function closeAsk(){ ask.hidden = true; }
  btnBk.onclick = function () { if (!btnBk.disabled) ask.hidden = false; };
  document.getElementById('askNo').onclick  = closeAsk;
  document.getElementById('askYes').onclick = function () { closeAsk(); disarm(); doBreak(); };
  ask.addEventListener('click', function (e) { if (e.target === ask) closeAsk(); });

  /* --- δοκιμή notification: κράτα πατημένη την κεφαλίδα 1,5" --- */
  (function () {
    var head = document.querySelector('.head'), timer = null;
    function down() {
      timer = setTimeout(function () {
        if (!A || !A.schedule) return;
        A.schedule(9, String(Date.now() + 15000), 'Δοκιμή ειδοποίησης',
                   'Αν το βλέπεις, τα notifications παίζουν κανονικά.');
        var old = elState.innerHTML;
        elState.textContent = 'Δοκιμή σε 15 δευτερόλεπτα…';
        setTimeout(function () { elState.innerHTML = old; }, 6000);
      }, 1500);
    }
    function up() { clearTimeout(timer); }
    head.addEventListener('touchstart', down, { passive: true });
    head.addEventListener('mousedown', down);
    ['touchend','touchcancel','mouseup','mouseleave'].forEach(function (e) {
      head.addEventListener(e, up);
    });
  })();

  st = load();
  if (st.start && now() >= st.start + SHIFT) celebrated = false;
  render();

  /* η δοκιμαστική γιορτή παίζει μία φορά και καταναλώνεται */
  try {
    if (localStorage.getItem(TESTKEY) === '1') {
      localStorage.removeItem(TESTKEY);
      showHoliday();
    }
  } catch (e) {}
  setInterval(render, 500);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) {
      var t = new Date();
      playMood(t.getDay());
      if (HOLIDAYS[ymd(t)]) showHoliday();
      render();
    }
  });

  /* ------------------ confetti, μόνο μέσα στο card ------------------ */
  function confetti() {
    var cv = document.getElementById('confetti');
    var w = card.clientWidth, h = card.clientHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = w * dpr; cv.height = h * dpr;
    var ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var colors = ['#4ade80','#f0b429','#58b0c8','#f472b6','#e7eaf0'];
    var bits = [];
    for (var i = 0; i < 70; i++) {
      bits.push({
        x: Math.random() * w, y: -10 - Math.random() * h * 0.9,
        vx: (Math.random() - 0.5) * 0.7, vy: 0.9 + Math.random() * 1.7,
        s: 3 + Math.random() * 4, r: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.22, sw: 0.4 + Math.random() * 0.6,
        c: colors[(Math.random() * colors.length) | 0]
      });
    }

    var t0 = performance.now();
    (function frame(t) {
      var age = t - t0;
      ctx.clearRect(0, 0, w, h);
      ctx.globalAlpha = age > 2600 ? Math.max(0, 1 - (age - 2600) / 900) : 1;
      for (var i = 0; i < bits.length; i++) {
        var b = bits[i];
        b.x += b.vx + Math.sin((age / 400) + b.r) * 0.25;
        b.y += b.vy; b.r += b.vr; b.vy += 0.013;
        ctx.save();
        ctx.translate(b.x, b.y); ctx.rotate(b.r);
        ctx.scale(1, Math.abs(Math.cos(age / 260 * b.sw)) * 0.8 + 0.2);
        ctx.fillStyle = b.c;
        ctx.fillRect(-b.s / 2, -b.s / 2, b.s, b.s * 0.62);
        ctx.restore();
      }
      if (age < 3600) requestAnimationFrame(frame);
      else ctx.clearRect(0, 0, w, h);
    })(t0);
  }
})();
</script>
