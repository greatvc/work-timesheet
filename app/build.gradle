plugins { id 'com.android.application' }

android {
    namespace 'gr.vassili.work'
    compileSdk 34

    defaultConfig {
        applicationId 'gr.vassili.work'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        common {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug   { signingConfig signingConfigs.common }
        release { minifyEnabled false; signingConfig signingConfigs.common }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
